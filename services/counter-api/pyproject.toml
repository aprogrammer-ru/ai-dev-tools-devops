[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "counter-api"
version = "0.1.0"
description = "Distributed counter API service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic",
    "asyncpg",
    "fastapi",
    "httpx",
    "prometheus-fastapi-instrumentator",
    "pydantic-settings",
    "python-json-logger",
    "redis[hiredis]",
    "sqlalchemy[asyncio]",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "testcontainers[postgres,redis]",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = ["/app"]
